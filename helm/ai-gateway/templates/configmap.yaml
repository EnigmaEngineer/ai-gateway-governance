apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.name" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
data:
  # These two came off a measurement on 2026-11-03 and they have to match
  # gateway/app.py. A chart that sets a smaller holdback than the module was
  # measured at is a leak nobody would see in a rendered manifest.
  stream_holdback_chars: {{ .Values.guardrail.streamHoldbackChars | quote }}
  stream_lookbehind_chars: {{ .Values.guardrail.streamLookbehindChars | quote }}
  guardrail_port: {{ .Values.guardrail.port | quote }}
